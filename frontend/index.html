<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clinic Voice Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232F6F6B'/%3E%3Cpath d='M11 5h2v14h-2z' fill='white'/%3E%3Cpath d='M5 11h14v2H5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --mist: #EFF4F1;
    --paper: #FFFFFF;
    --ink: #16232C;
    --pine: #2F6F6B;
    --pine-dark: #234F4C;
    --ember: #D98A3D;
    --fog: #B9C4C1;
    --fog-light: #DCE4E2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--mist);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--pine);
    outline-offset: 3px;
  }

  .shell {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--pine);
    position: relative;
    flex-shrink: 0;
  }
  .logo-mark::before, .logo-mark::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 1px;
  }
  .logo-mark::before { width: 4px; height: 18px; top: 9px; left: 16px; }
  .logo-mark::after { width: 18px; height: 4px; top: 16px; left: 9px; }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .brand .tagline {
    font-size: 13px;
    color: var(--fog);
    margin-top: 2px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fog);
  }

  .care-team {
    display: flex;
    gap: 10px;
    margin: 20px 0 24px;
    flex-wrap: wrap;
  }

  .doctor-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    box-shadow: 0 1px 2px rgba(22,35,44,0.05);
  }

  .doctor-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 500;
    color: white;
    flex-shrink: 0;
  }
  .doctor-avatar.a { background: var(--pine); }
  .doctor-avatar.b { background: var(--ember); }

  .doctor-info { line-height: 1.25; }
  .doctor-name { font-size: 13px; font-weight: 500; }
  .doctor-specialty { font-size: 11.5px; color: var(--fog); }

  .call-screen {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
  }

  @media (max-width: 720px) {
    .call-screen { grid-template-columns: 1fr; }
  }

  .presence-panel {
    background: var(--paper);
    border-radius: 20px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 1px 2px rgba(22,35,44,0.04), 0 8px 24px rgba(22,35,44,0.05);
  }

  .orb-wrap {
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 20px;
  }

  .orb-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid var(--fog-light);
  }
  .orb-core {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--fog);
    transition: background 0.4s ease, transform 0.4s ease;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb-core svg { width: 34px; height: 34px; }
  .orb-core path {
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .orb-wrap.idle .orb-core { animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .orb-wrap.listening .orb-core { background: var(--pine); }
  .orb-wrap.listening .orb-ring {
    border-color: var(--pine);
    animation: pulse-ring 1.8s ease-out infinite;
  }
  .orb-wrap.listening .ring-1 { animation-delay: 0s; }
  .orb-wrap.listening .ring-2 { animation-delay: 0.6s; }
  .orb-wrap.listening .ring-3 { animation-delay: 1.2s; }
  @keyframes pulse-ring {
    0% { width: 90px; height: 90px; opacity: 0.7; }
    100% { width: 180px; height: 180px; opacity: 0; }
  }

  .orb-wrap.thinking .orb-core { background: var(--ember); }
  .orb-wrap.thinking .orb-core svg { animation: pulse-line 1.2s ease-in-out infinite; }
  @keyframes pulse-line { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .orb-wrap.thinking .orb-ring.think-dash {
    width: 130px; height: 130px;
    border: 2.5px dashed var(--ember);
    animation: spin 2.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .orb-wrap.speaking .orb-core { background: var(--ember); animation: speak-core 0.5s ease-in-out infinite alternate; }
  @keyframes speak-core { from { transform: scale(1); } to { transform: scale(1.12); } }
  .orb-wrap.speaking .orb-ring {
    border-color: var(--ember);
    animation: pulse-ring 1.1s ease-out infinite;
  }
  .orb-wrap.speaking .ring-1 { animation-delay: 0s; }
  .orb-wrap.speaking .ring-2 { animation-delay: 0.35s; }
  .orb-wrap.speaking .ring-3 { animation-delay: 0.7s; }

  @media (prefers-reduced-motion: reduce) {
    .orb-core, .orb-ring { animation: none !important; }
  }

  .status-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fog);
    margin-bottom: 4px;
  }
  .status-label.active { color: var(--pine); }
  .status-label.speaking-label { color: var(--ember); }

  .call-btn {
    margin-top: 24px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: var(--pine-dark);
    color: var(--paper);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .call-btn:hover { transform: translateY(-1px); }
  .call-btn.recording { background: #B23A3A; }

  .hint {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--fog);
    line-height: 1.5;
  }

  .transcript-panel {
    background: var(--paper);
    border-radius: 20px;
    padding: 8px 0;
    box-shadow: 0 1px 2px rgba(22,35,44,0.04), 0 8px 24px rgba(22,35,44,0.05);
    display: flex;
    flex-direction: column;
    min-height: 420px;
    max-height: 620px;
  }

  .transcript-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fog);
    padding: 14px 24px 10px;
    border-bottom: 1px solid var(--fog-light);
  }

  .transcript-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
  }

  .empty-state {
    color: var(--fog);
    font-size: 14px;
    text-align: center;
    margin-top: 80px;
    line-height: 1.6;
  }

  .line {
    margin-bottom: 14px;
    max-width: 88%;
    line-height: 1.5;
    font-size: 14.5px;
  }
  .line .who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 3px;
  }
  .line.user { margin-left: auto; text-align: right; }
  .line.user .who { color: var(--pine); }
  .line.user .bubble {
    background: #EAF3F1;
    display: inline-block;
    padding: 8px 14px;
    border-radius: 14px 14px 2px 14px;
  }
  .line.agent .who { color: var(--ember); }
  .line.agent .bubble {
    background: #FBF2E6;
    display: inline-block;
    padding: 8px 14px;
    border-radius: 14px 14px 14px 2px;
  }
  .line.system {
    color: var(--fog);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    max-width: 100%;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const CARE_TEAM = [
  { initials: "AK", name: "Dr. Ahmed Khan", specialty: "Cardiology", cls: "a" },
  { initials: "SM", name: "Dr. Sara Malik", specialty: "Dermatology", cls: "b" },
];

function PulseIcon() {
  return (
    <svg viewBox="0 0 24 24">
      <path d="M2 12h4l2-7 4 14 3-10 2 3h5" />
    </svg>
  );
}

function App() {
  const [callState, setCallState] = useState("idle");
  const [recording, setRecording] = useState(false);
  const [lines, setLines] = useState([]);

  const wsRef = useRef(null);
  const mediaRecorderRef = useRef(null);
  const audioQueueRef = useRef([]);
  const isPlayingRef = useRef(false);
  const transcriptEndRef = useRef(null);
  const lineIdRef = useRef(0);

  useEffect(() => {
    transcriptEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [lines]);

  function addLine(role, text, streamId) {
    setLines(prev => {
      if (streamId !== undefined) {
        const last = prev[prev.length - 1];
        if (last && last.role === role && last.streamId === streamId) {
          const updated = [...prev];
          updated[updated.length - 1] = { ...last, text: last.text + text };
          return updated;
        }
      }
      lineIdRef.current += 1;
      return [...prev, { id: lineIdRef.current, role, text, streamId }];
    });
  }

  async function playNextInQueue() {
    if (isPlayingRef.current || audioQueueRef.current.length === 0) return;
    isPlayingRef.current = true;
    const bytes = audioQueueRef.current.shift();
    const blob = new Blob([bytes], { type: "audio/mp3" });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => {
      URL.revokeObjectURL(url);
      isPlayingRef.current = false;
      playNextInQueue();
    };
    audio.onerror = () => {
      isPlayingRef.current = false;
      playNextInQueue();
    };
    await audio.play();
  }

  async function startCall() {
    const ws = new WebSocket("ws://localhost:8000/ws");
    ws.binaryType = "arraybuffer";
    wsRef.current = ws;

    ws.onopen = async () => {
      setCallState("listening");
      addLine("system", "Connected");

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
      mediaRecorderRef.current = mediaRecorder;

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
          ws.send(event.data);
        }
      };
      mediaRecorder.start(250);
      setRecording(true);
    };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        const data = JSON.parse(event.data);
        if (data.status) setCallState(data.status === "listening" ? "listening" : data.status);
        if (data.transcript && data.is_final) addLine("user", data.transcript);
        if (data.llm_chunk) addLine("agent", data.llm_chunk, data.stream_id);
        if (data.llm_done) setCallState("listening");
        if (data.status === "error") addLine("system", "Error: " + data.error);
      } else {
        audioQueueRef.current.push(event.data);
        playNextInQueue();
      }
    };

    ws.onclose = () => {
      setCallState("idle");
      addLine("system", "Call ended");
    };
  }

  function endCall() {
    const mediaRecorder = mediaRecorderRef.current;
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "end_session" }));
      ws.close();
    }
    setRecording(false);
    setCallState("idle");
  }

  function toggleCall() {
    if (!recording) startCall();
    else endCall();
  }

  const statusText = {
    idle: "Ready to talk",
    listening: "Listening",
    thinking: "Thinking",
    speaking: "Speaking",
  }[callState] || "Ready to talk";

  const statusClass =
    callState === "listening" ? "active" :
    callState === "speaking" ? "speaking-label" : "";

  return (
    <div className="shell">
      <header className="masthead">
        <div className="brand">
          <div className="logo-mark"></div>
          <div>
            <h1>Meridian Clinic</h1>
            <div className="tagline">Talk to our care team, any time</div>
          </div>
        </div>
        <span className="eyebrow">Live test console</span>
      </header>

      <div className="care-team">
        {CARE_TEAM.map(doc => (
          <div className="doctor-chip" key={doc.name}>
            <div className={"doctor-avatar " + doc.cls}>{doc.initials}</div>
            <div className="doctor-info">
              <div className="doctor-name">{doc.name}</div>
              <div className="doctor-specialty">{doc.specialty}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="call-screen">
        <div className="presence-panel">
          <div className={"orb-wrap " + callState}>
            <div className="orb-ring ring-1"></div>
            <div className="orb-ring ring-2"></div>
            <div className="orb-ring ring-3"></div>
            {callState === "thinking" && <div className="orb-ring think-dash"></div>}
            <div className="orb-core"><PulseIcon /></div>
          </div>

          <div className={"status-label " + statusClass}>{statusText}</div>

          <button
            className={"call-btn" + (recording ? " recording" : "")}
            onClick={toggleCall}
          >
            {recording ? "End call" : "Start call"}
          </button>

          <p className="hint">
            {recording
              ? "Speak naturally — the assistant is listening."
              : "Click to start a call and allow microphone access."}
          </p>
        </div>

        <div className="transcript-panel">
          <div className="transcript-header">Transcript</div>
          <div className="transcript-scroll">
            {lines.length === 0 && (
              <div className="empty-state">
                Your conversation will appear here once the call starts.
              </div>
            )}
            {lines.map(line => (
              <div key={line.id} className={"line " + line.role}>
                {line.role !== "system" && (
                  <span className="who">{line.role === "user" ? "You" : "Assistant"}</span>
                )}
                {line.role === "system" ? line.text : <span className="bubble">{line.text}</span>}
              </div>
            ))}
            <div ref={transcriptEndRef}></div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
